<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academia de Violão</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#000;color:#fff;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:24px;
  }
  .logo{font-weight:700;letter-spacing:.5px;padding:8px 0 40px;opacity:.9}
  .hero{text-align:center;max-width:560px;margin:auto 0}
  .icone{font-size:64px;margin-bottom:16px}
  h1{font-size:clamp(2.4rem,10vw,4rem);line-height:1.05;font-weight:800}
  .hero p{margin:20px 0 32px;color:#bbb;font-size:1.1rem;line-height:1.6}
  .btn{
    display:inline-block;background:#fff;color:#000;text-decoration:none;
    font-weight:700;font-size:1.05rem;padding:16px 40px;border-radius:999px;
    transition:transform .2s;
  }
  .btn:hover{transform:scale(1.05)}
  .aula{
    width:100%;max-width:560px;margin:64px 0 40px;
    border:1px solid #fff;border-radius:20px;padding:28px;
  }
  .aula small{color:#aaa}
  .aula h2{margin:6px 0 12px;font-size:1.5rem}
  .aula p{color:#ccc;line-height:1.6;margin-bottom:16px}
  .aula ol{padding-left:20px;line-height:1.9}
</style>
</head>
<body>

  <div class="logo">Academia de Violão</div>

  <section class="hero">
    <div class="icone">🎸</div>
    <h1>Academia de Violão</h1>
